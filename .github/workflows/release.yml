name: Release

# Publishes @icedq/mcp-server to npm when a GitHub Release is published,
# or on-demand via manual dispatch.
# Authentication is handled via npm Trusted Publishing (OIDC) — no NPM_TOKEN.
# The `release` environment gates every publish behind required reviewers.
#
# This repository is public, so npm provenance is enabled below — each publish
# gets a signed attestation (via Sigstore) linking the package back to this
# exact workflow run and commit. Verify with: npm audit signatures.
#
# PREREQUISITES (one-time, on npmjs.com / GitHub):
#   1. Register a Trusted Publisher for @icedq/mcp-server:
#      org icedq-tools, repo mcp-server, workflow release.yml, environment release.
#   2. Create the `release` GitHub Environment with required reviewers.
#   3. Set npm publishing access to "require 2FA and disallow tokens".

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag to publish under (manual runs only)
        type: choice
        default: latest
        options:
          - latest
          - beta

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC token for npm Trusted Publishing — publish job only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm install -g npm@11 # Trusted Publishing needs npm >= 11.5.1; pin 11.x (npm@latest/12 dropped Node 20)
      - run: npm ci
      - name: Stage npm package layout
        # No build/compile step — icedq-mcp-server.js and guidance/ are the
        # already-finished bundle, checked in at repo root. This just lays
        # them out under dist/ the way the published package expects.
        run: |
          mkdir -p dist
          cp icedq-mcp-server.js dist/
          cp -r guidance dist/
      - name: Verify tarball includes the entry point
        # Guard against a mis-packaged publish: fail if package.json "main" isn't in the tarball.
        run: |
          npm pack --dry-run --json > pack-manifest.json
          node -e "const files=require('./pack-manifest.json')[0].files.map(f=>f.path); const main=require('./package.json').main; if(!files.includes(main)){console.error('Refusing to publish: entry point '+main+' is not in the package tarball. Packed files: '+files.join(', ')); process.exit(1);} console.log('OK: '+main+' present in tarball ('+files.length+' files).');"
        # dist-tag resolution:
        #  - release event: follows the GitHub Release (pre-release -> "beta", normal -> "latest").
        #  - workflow_dispatch: follows the manually chosen "tag" input (defaults to "latest").
        # This keeps `latest` stable while shipping betas to opt-in testers (npm i @icedq/mcp-server@beta).
      - run: npm publish --tag "$NPM_TAG" # auth automatic via Trusted Publishing
        env:
          NPM_CONFIG_PROVENANCE: 'true' # public repo — enables npm provenance attestation
          NPM_TAG: ${{ github.event_name == 'release' && (github.event.release.prerelease && 'beta' || 'latest') || (github.event.inputs.tag || 'latest') }}
