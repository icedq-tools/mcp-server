name: Release

# Publishes @icedq/mcp-server to npm, then publishes server.json to the
# official MCP Registry (registry.modelcontextprotocol.io), when a GitHub
# Release is published, or on-demand via manual dispatch.
# npm auth is handled via npm Trusted Publishing (OIDC) — no NPM_TOKEN.
# MCP Registry auth is handled via GitHub OIDC — no extra secret, since
# server.json's name (io.github.icedq-tools/mcp-server) matches this org.
# The `release` environment gates every publish behind required reviewers.
#
# This repository is public, so npm provenance is enabled below — each publish
# gets a signed attestation (via Sigstore) linking the package back to this
# exact workflow run and commit. Verify with: npm audit signatures.
#
# PREREQUISITES (one-time, on npmjs.com / GitHub):
#   1. Register a Trusted Publisher for @icedq/mcp-server:
#      org icedq-tools, repo mcp-server, workflow release.yml, environment release.
#   2. Create the `release` GitHub Environment with required reviewers.
#   3. Set npm publishing access to "require 2FA and disallow tokens".
#
# server.json's "version" must be bumped in lockstep with package.json's
# "version" before tagging a release — the MCP Registry publish step below
# fails fast if they've drifted apart.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag to publish under (manual runs only)
        type: choice
        default: latest
        options:
          - latest
          - beta

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC token for npm Trusted Publishing — publish job only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm install -g npm@11 # Trusted Publishing needs npm >= 11.5.1; pin 11.x (npm@latest/12 dropped Node 20)
      - run: npm ci
      - name: Stage npm package layout
        # No build/compile step — icedq-mcp-server.js and guidance/ are the
        # already-finished bundle, checked in at repo root. This just lays
        # them out under dist/ the way the published package expects.
        run: |
          mkdir -p dist
          cp icedq-mcp-server.js dist/
          cp -r guidance dist/
      - name: Verify tarball includes the entry point
        # Guard against a mis-packaged publish: fail if package.json "main" isn't in the tarball.
        run: |
          npm pack --dry-run --json > pack-manifest.json
          node -e "const files=require('./pack-manifest.json')[0].files.map(f=>f.path); const main=require('./package.json').main; if(!files.includes(main)){console.error('Refusing to publish: entry point '+main+' is not in the package tarball. Packed files: '+files.join(', ')); process.exit(1);} console.log('OK: '+main+' present in tarball ('+files.length+' files).');"
        # dist-tag resolution:
        #  - release event: follows the GitHub Release (pre-release -> "beta", normal -> "latest").
        #  - workflow_dispatch: follows the manually chosen "tag" input (defaults to "latest").
        # This keeps `latest` stable while shipping betas to opt-in testers (npm i @icedq/mcp-server@beta).
      - name: Check if this version is already on npm
        # Guards against a cancelled-then-retried run: npm registry rejects a
        # second publish of the same version (E409), which would otherwise
        # fail this job and skip publish-mcp-registry even though the first
        # attempt already succeeded.
        id: npm_check
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$PKG_NAME@$PKG_VERSION is already on npm — skipping publish (idempotent retry)."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm publish --tag "$NPM_TAG" # auth automatic via Trusted Publishing
        if: steps.npm_check.outputs.already_published == 'false'
        env:
          NPM_CONFIG_PROVENANCE: 'true' # public repo — enables npm provenance attestation
          NPM_TAG: ${{ github.event_name == 'release' && (github.event.release.prerelease && 'beta' || 'latest') || (github.event.inputs.tag || 'latest') }}

  publish-mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC token for MCP Registry github-oidc auth
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify server.json version matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          SERVER_VERSION=$(node -p "require('./server.json').version")
          if [ "$PKG_VERSION" != "$SERVER_VERSION" ]; then
            echo "::error::server.json version ($SERVER_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi
          for pkg_entry in $(node -p "require('./server.json').packages.map(p => p.version).join(' ')"); do
            if [ "$pkg_entry" != "$PKG_VERSION" ]; then
              echo "::error::server.json packages[].version ($pkg_entry) does not match package.json version ($PKG_VERSION)."
              exit 1
            fi
          done
      - name: Check for a stable (non-prerelease) version
        # The MCP Registry listing should only ever reflect official releases.
        # Anything with a prerelease suffix (-beta, -pre, -rc, -testing, ...)
        # still publishes to npm under the beta dist-tag, but is skipped here.
        id: version_check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "$PKG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping MCP Registry publish — $PKG_VERSION is a prerelease version."
          fi
      - name: Install mcp-publisher
        if: steps.version_check.outputs.is_stable == 'true'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Login to MCP Registry via GitHub OIDC
        if: steps.version_check.outputs.is_stable == 'true'
        run: ./mcp-publisher login github-oidc
      - name: Publish to MCP Registry
        if: steps.version_check.outputs.is_stable == 'true'
        run: ./mcp-publisher publish
